services:
  next:
    build:
      dockerfile: docker/next/Dockerfile
    restart: unless-stopped
    environment:
      MONGO: mongodb://mongo/kobros
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - kobros
    # Caddy proxies to it; Docker bypasses ufw, so bind to localhost only.
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    # Pinned by version and digest: upgrades happen when we decide (Dependabot proposes them).
    # 7.0, not 8.x: MongoDB 8 refuses to start on Ubuntu 26.04's kernel (7.0.0-NN, which is
    # really 7.0.14 and fixed), because its startup check reads Ubuntu's version string.
    # Back to 8.x when https://jira.mongodb.org/browse/SERVER-136848 is fixed. Supported until 2027-08.
    image: mongo:7.0.45-jammy@sha256:7fba8c37d681a79f22a85d2b06bd5ed121a7973c0a6ca20ed4887bb0a1548ce0
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    networks:
      - kobros
    # Localhost only, for `pnpm dev` and mongodump; never public.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  kobros:
    driver: bridge

volumes:
  mongodata:
