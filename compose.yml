services:
  next:
    build:
      dockerfile: docker/next/Dockerfile
    restart: unless-stopped
    environment:
      MONGO: mongodb://mongo/kobros
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - kobros
    # Caddy proxies to it; Docker bypasses ufw, so bind to localhost only.
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    # Pinned by version and digest: upgrades happen when we decide (Dependabot proposes them).
    image: mongo:9.0.2-noble@sha256:61dd87ff554dc20386c63ebe1f7ede27314370ad5a7bf357c685fab424672158
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    networks:
      - kobros
    # Localhost only, for `pnpm dev` and mongodump; never public.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  kobros:
    driver: bridge

volumes:
  mongodata:
